name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main # Change this to your default branch name

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/actions-setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm install

      - name: Build Next.js 🏗️
        run: npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out # Next.js static export default folder
          branch: gh-pages # The branch the action will push to
